<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A browser game where you bring a public-interest AI online, then trace every chip choice back through the semiconductor supply chain." />
    <meta name="theme-color" content="#14213d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rock to Rack" />
    <meta property="og:description" content="Bring Nova online, light the city, and trace the chip supply chain from rock to rack." />
    <meta property="og:image" content="/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rock to Rack" />
    <meta name="twitter:description" content="Bring Nova online, light the city, and trace the chip supply chain from rock to rack." />
    <meta name="twitter:image" content="/og-cover.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Rock to Rack</title>
  </head>
  <body>
    <div id="app">
      <section id="loading-screen" class="loading-screen" aria-live="polite">
        <div class="loading-mark" aria-hidden="true">
          <span class="loading-node" style="--node-index: 0"></span>
          <span class="loading-link"></span>
          <span class="loading-node" style="--node-index: 1"></span>
          <span class="loading-link"></span>
          <span class="loading-node" style="--node-index: 2"></span>
          <span class="loading-link"></span>
          <span class="loading-node" style="--node-index: 3"></span>
          <span class="loading-link"></span>
          <span class="loading-node" style="--node-index: 4"></span>
          <span class="loading-link"></span>
          <span class="loading-node" style="--node-index: 5"></span>
        </div>
        <h1>Rock to Rack</h1>
        <p class="loading-tagline">Mine &middot; Refine &middot; Grow &middot; Fab &middot; Package &middot; Power</p>
        <p id="loading-fact">A single wafer can hold thousands of tiny chip dies.</p>
      </section>
      <div id="game-root" aria-label="Rock to Rack game canvas"></div>
      <div id="ui-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
